name: Build liquidshell (Void Linux aarch64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "liquidshell version"
        default: "1.10.0"
  push:
    tags: ["v*"]

env:
  LS_VERSION: ${{ github.event.inputs.version || '1.10.0' }}

jobs:
  build:
    # Native arm64 runner (free for public repos). Void is built with xbps-src.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout void-packages
        uses: actions/checkout@v4
        with:
          repository: void-linux/void-packages
          path: void-packages
          fetch-depth: 1

      - name: Allow unprivileged user namespaces (needed by xbps-src)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Install static xbps
        run: |
          mkdir -p "$HOME/xbps"
          curl -fsSL https://repo-default.voidlinux.org/static/xbps-static-latest.aarch64-musl.tar.xz \
            | tar -xJ -C "$HOME/xbps"
          echo "$HOME/xbps/usr/bin" >> "$GITHUB_PATH"

      - name: Create liquidshell template
        working-directory: void-packages
        run: |
          curl -fsSLo /tmp/ls.tar.xz \
            "https://download.kde.org/stable/liquidshell/liquidshell-${LS_VERSION}.tar.xz"
          SUM=$(sha256sum /tmp/ls.tar.xz | cut -d' ' -f1)

          mkdir -p srcpkgs/liquidshell
          cat > srcpkgs/liquidshell/template <<EOF
          # Template file for 'liquidshell'
          pkgname=liquidshell
          version=${LS_VERSION}
          revision=1
          build_style=cmake
          configure_args="-DBUILD_TESTING=OFF -DKF6_HOST_TOOLING=/usr/lib/cmake
           -DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"
          hostmakedepends="extra-cmake-modules pkg-config gettext qt6-base qt6-tools
           kf6-kconfig kf6-kcoreaddons kf6-kcmutils"
          makedepends="qt6-base-devel kf6-bluez-qt-devel kf6-karchive-devel
           kf6-kconfig-devel kf6-kconfigwidgets-devel kf6-kcoreaddons-devel
           kf6-kcrash-devel kf6-kdbusaddons-devel kf6-kguiaddons-devel
           kf6-ki18n-devel kf6-kiconthemes-devel kf6-kitemviews-devel
           kf6-kjobwidgets-devel kf6-kcmutils-devel kf6-kio-devel
           kf6-knewstuff-devel kf6-knotifications-devel kf6-kservice-devel
           kf6-kwidgetsaddons-devel kf6-kwindowsystem-devel kf6-kxmlgui-devel
           kf6-networkmanager-qt-devel kf6-solid-devel
           kf6-kstatusnotifieritem-devel"
          depends="dbus"
          short_desc="Basic desktop shell leveraging KDE Frameworks 6"
          maintainer="CI <ci@example.com>"
          license="GPL-3.0-or-later"
          homepage="https://apps.kde.org/liquidshell"
          distfiles="https://download.kde.org/stable/liquidshell/liquidshell-\${version}.tar.xz"
          checksum=${SUM}
          EOF
          # strip the heredoc indentation
          sed -i 's/^          //' srcpkgs/liquidshell/template
          cat srcpkgs/liquidshell/template

      - name: Bootstrap and build
        working-directory: void-packages
        run: |
          ./xbps-src -A aarch64 binary-bootstrap
          ./xbps-src -A aarch64 -j"$(nproc)" pkg liquidshell

      - name: Index local repo
        working-directory: void-packages/hostdir/binpkgs
        run: |
          ls -la
          xbps-rindex -a ./*.xbps || true

      - uses: actions/upload-artifact@v4
        with:
          name: liquidshell-void-aarch64
          path: void-packages/hostdir/binpkgs/*.xbps

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: void-packages/hostdir/binpkgs/liquidshell-*.xbps